<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px/1.6 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
         width: 440px; margin: 0; padding: 14px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  button { font-size: 13px; padding: 6px 12px; cursor: pointer; }
  .cmd { background: #f4f4f4; border: 1px solid #ddd; border-radius: 4px; padding: 8px;
         word-break: break-all; white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace;
         font-size: 11px; margin: 6px 0; }
  .warn { color: #a00; }
  .ok { color: #070; }
  .step { margin-top: 12px; }
  .step b { display: block; margin-bottom: 2px; }
  .note { color: #666; font-size: 11px; margin-top: 12px; }
  .svc { color: #345; font-size: 11px; margin-bottom: 6px; }
</style>
<h1 data-i18n="popupTitle"></h1>
<div id="svc" class="svc"></div>
<div id="status"></div>
<p><button id="go" data-i18n="getButton"></button></p>
<div id="out"></div>
<div class="note">
  <div data-i18n="safetyNote"></div>
  <div data-i18n="unofficialNote"></div>
</div>
<script src="mask.js"></script>
<script src="services.js"></script>
<script src="popup.js"></script>
